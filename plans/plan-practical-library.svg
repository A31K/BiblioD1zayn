<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="План помещения для Практичная недорогая библиотека">
<style>
.bg{fill:#f7f7f3}.room{fill:#fff;stroke:#2d302c;stroke-width:4}.wall{stroke:#2d302c;stroke-width:8;stroke-linecap:round}.zone-title{font:700 22px Arial, sans-serif;fill:#2d302c}.zone-sub{font:15px Arial, sans-serif;fill:#546457}.caption{font:16px Arial, sans-serif;fill:#536256}.head{font:700 32px Arial, sans-serif;fill:#2d302c}.small{font:14px Arial, sans-serif;fill:#617166}
</style>
<rect width="1000" height="720" class="bg"/>
<text x="60" y="60" class="head">План: Практичная недорогая библиотека</text>
<text x="60" y="92" class="caption">Схема расстановки зон, примерно 6 × 4 м. Размеры адаптируются под конкретное помещение.</text>
<rect x="45" y="110" width="910" height="500" rx="26" class="room"/>
<line x1="150" y1="610" x2="330" y2="610" class="wall"/><text x="240" y="646" text-anchor="middle" class="small">вход</text>
<line x1="460" y1="110" x2="630" y2="110" stroke="#9ac29d" stroke-width="8" stroke-linecap="round"/><text x="545" y="100" text-anchor="middle" class="small">окно / свет</text>
<rect x="70" y="125" width="260" height="170" rx="18" fill="#d9bd86" stroke="#315f45" stroke-width="2"/><text x="200.0" y="155" text-anchor="middle" class="zone-title">Готовые стеллажи</text><text x="200.0" y="181" text-anchor="middle" class="zone-sub">вдоль стены</text><rect x="385" y="125" width="230" height="170" rx="18" fill="#ffffff" stroke="#315f45" stroke-width="2"/><text x="500.0" y="155" text-anchor="middle" class="zone-title">Общие столы</text><text x="500.0" y="181" text-anchor="middle" class="zone-sub">стандартная мебель</text><rect x="670" y="125" width="240" height="170" rx="18" fill="#84a86d" stroke="#315f45" stroke-width="2"/><text x="790.0" y="155" text-anchor="middle" class="zone-title">Акцентная зона</text><text x="790.0" y="181" text-anchor="middle" class="zone-sub">постеры</text><text x="790.0" y="201" text-anchor="middle" class="zone-sub">растения</text><rect x="70" y="365" width="365" height="180" rx="18" fill="#f7f4ec" stroke="#315f45" stroke-width="2"/><text x="252.5" y="395" text-anchor="middle" class="zone-title">Чтение / работа</text><text x="252.5" y="421" text-anchor="middle" class="zone-sub">простая посадка</text><rect x="500" y="365" width="410" height="180" rx="18" fill="#eef6ec" stroke="#315f45" stroke-width="2"/><text x="705.0" y="395" text-anchor="middle" class="zone-title">Свободный проход</text><text x="705.0" y="421" text-anchor="middle" class="zone-sub">не загромождать центр</text>
<text x="60" y="690" class="small">Важно: это схематический план для идеи расстановки, а не инженерный строительный проект.</text>
</svg>