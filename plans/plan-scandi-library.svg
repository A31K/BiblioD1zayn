<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="План помещения для Скандинавская библиотека">
<style>
.bg{fill:#fbfbf7}.room{fill:#fff;stroke:#d7e5ef;stroke-width:4}.wall{stroke:#d7e5ef;stroke-width:8;stroke-linecap:round}.zone-title{font:700 22px Arial, sans-serif;fill:#d7e5ef}.zone-sub{font:15px Arial, sans-serif;fill:#546457}.caption{font:16px Arial, sans-serif;fill:#536256}.head{font:700 32px Arial, sans-serif;fill:#d7e5ef}.small{font:14px Arial, sans-serif;fill:#617166}
</style>
<rect width="1000" height="720" class="bg"/>
<text x="60" y="60" class="head">План: Скандинавская библиотека</text>
<text x="60" y="92" class="caption">Схема расстановки зон, примерно 6 × 4 м. Размеры адаптируются под конкретное помещение.</text>
<rect x="45" y="110" width="910" height="500" rx="26" class="room"/>
<line x1="150" y1="610" x2="330" y2="610" class="wall"/><text x="240" y="646" text-anchor="middle" class="small">вход</text>
<line x1="460" y1="110" x2="630" y2="110" stroke="#9ac29d" stroke-width="8" stroke-linecap="round"/><text x="545" y="100" text-anchor="middle" class="small">окно / свет</text>
<rect x="70" y="125" width="270" height="170" rx="18" fill="#d7b98c" stroke="#315f45" stroke-width="2"/><text x="205.0" y="155" text-anchor="middle" class="zone-title">Стеллажи</text><text x="205.0" y="181" text-anchor="middle" class="zone-sub">абонемент</text><rect x="395" y="125" width="220" height="170" rx="18" fill="#ffffff" stroke="#315f45" stroke-width="2"/><text x="505.0" y="155" text-anchor="middle" class="zone-title">Рабочие места</text><text x="505.0" y="181" text-anchor="middle" class="zone-sub">читальный стол</text><rect x="670" y="125" width="240" height="170" rx="18" fill="#b9cdb4" stroke="#315f45" stroke-width="2"/><text x="790.0" y="155" text-anchor="middle" class="zone-title">Тихая зона</text><text x="790.0" y="181" text-anchor="middle" class="zone-sub">мягкая зона</text><rect x="70" y="365" width="380" height="180" rx="18" fill="#f7f4ec" stroke="#315f45" stroke-width="2"/><text x="260.0" y="395" text-anchor="middle" class="zone-title">Читальный стол</text><text x="260.0" y="421" text-anchor="middle" class="zone-sub">основная работа с</text><text x="260.0" y="441" text-anchor="middle" class="zone-sub">книгами</text><rect x="520" y="365" width="390" height="180" rx="18" fill="#eef6ec" stroke="#315f45" stroke-width="2"/><text x="715.0" y="395" text-anchor="middle" class="zone-title">Мягкое чтение</text><text x="715.0" y="421" text-anchor="middle" class="zone-sub">витрина новинок</text>
<text x="60" y="690" class="small">Важно: это схематический план для идеи расстановки, а не инженерный строительный проект.</text>
</svg>