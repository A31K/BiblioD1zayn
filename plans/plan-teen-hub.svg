<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="План помещения для Молодёжный хаб">
<style>
.bg{fill:#f3f6f0}.room{fill:#fff;stroke:#86b86e;stroke-width:4}.wall{stroke:#86b86e;stroke-width:8;stroke-linecap:round}.zone-title{font:700 22px Arial, sans-serif;fill:#86b86e}.zone-sub{font:15px Arial, sans-serif;fill:#546457}.caption{font:16px Arial, sans-serif;fill:#536256}.head{font:700 32px Arial, sans-serif;fill:#86b86e}.small{font:14px Arial, sans-serif;fill:#617166}
</style>
<rect width="1000" height="720" class="bg"/>
<text x="60" y="60" class="head">План: Молодёжный хаб</text>
<text x="60" y="92" class="caption">Схема расстановки зон, примерно 9 × 7 м. Размеры адаптируются под конкретное помещение.</text>
<rect x="45" y="110" width="910" height="500" rx="26" class="room"/>
<line x1="150" y1="610" x2="330" y2="610" class="wall"/><text x="240" y="646" text-anchor="middle" class="small">вход</text>
<line x1="460" y1="110" x2="630" y2="110" stroke="#9ac29d" stroke-width="8" stroke-linecap="round"/><text x="545" y="100" text-anchor="middle" class="small">окно / свет</text>
<rect x="70" y="125" width="300" height="170" rx="18" fill="#2f3633" stroke="#315f45" stroke-width="2"/><text x="220.0" y="155" text-anchor="middle" class="zone-title">Стеллажи</text><text x="220.0" y="181" text-anchor="middle" class="zone-sub">фонд и новинки</text><rect x="420" y="125" width="490" height="170" rx="18" fill="#9ec66f" stroke="#315f45" stroke-width="2"/><text x="665.0" y="155" text-anchor="middle" class="zone-title">Гибкая площадка</text><text x="665.0" y="181" text-anchor="middle" class="zone-sub">лекции</text><text x="665.0" y="201" text-anchor="middle" class="zone-sub">встречи</text><text x="665.0" y="221" text-anchor="middle" class="zone-sub">мастер-классы</text><rect x="70" y="365" width="260" height="180" rx="18" fill="#fff" stroke="#315f45" stroke-width="2"/><text x="200.0" y="395" text-anchor="middle" class="zone-title">Коворкинг</text><text x="200.0" y="421" text-anchor="middle" class="zone-sub">столы и розетки</text><rect x="385" y="365" width="235" height="180" rx="18" fill="#f3f4f1" stroke="#315f45" stroke-width="2"/><text x="502.5" y="395" text-anchor="middle" class="zone-title">Мягкая зона</text><text x="502.5" y="421" text-anchor="middle" class="zone-sub">пуфы</text><text x="502.5" y="441" text-anchor="middle" class="zone-sub">кресла</text><rect x="675" y="365" width="235" height="180" rx="18" fill="#fff7df" stroke="#315f45" stroke-width="2"/><text x="792.5" y="395" text-anchor="middle" class="zone-title">Выставка</text><text x="792.5" y="421" text-anchor="middle" class="zone-sub">панели и витрины</text>
<text x="60" y="690" class="small">Важно: это схематический план для идеи расстановки, а не инженерный строительный проект.</text>
</svg>