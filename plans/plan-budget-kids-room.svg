<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="План помещения для Недорогая детская библиотека">
<style>
.bg{fill:#fff8df}.room{fill:#fff;stroke:#d9b87c;stroke-width:4}.wall{stroke:#d9b87c;stroke-width:8;stroke-linecap:round}.zone-title{font:700 22px Arial, sans-serif;fill:#d9b87c}.zone-sub{font:15px Arial, sans-serif;fill:#546457}.caption{font:16px Arial, sans-serif;fill:#536256}.head{font:700 32px Arial, sans-serif;fill:#d9b87c}.small{font:14px Arial, sans-serif;fill:#617166}
</style>
<rect width="1000" height="720" class="bg"/>
<text x="60" y="60" class="head">План: Недорогая детская библиотека</text>
<text x="60" y="92" class="caption">Схема расстановки зон, примерно 6 × 4 м. Размеры адаптируются под конкретное помещение.</text>
<rect x="45" y="110" width="910" height="500" rx="26" class="room"/>
<line x1="150" y1="610" x2="330" y2="610" class="wall"/><text x="240" y="646" text-anchor="middle" class="small">вход</text>
<line x1="460" y1="110" x2="630" y2="110" stroke="#9ac29d" stroke-width="8" stroke-linecap="round"/><text x="545" y="100" text-anchor="middle" class="small">окно / свет</text>
<rect x="70" y="125" width="260" height="160" rx="18" fill="#629cc1" stroke="#315f45" stroke-width="2"/><text x="200.0" y="155" text-anchor="middle" class="zone-title">Низкие стеллажи</text><text x="200.0" y="181" text-anchor="middle" class="zone-sub">низкий книжный стеллаж</text><rect x="380" y="125" width="250" height="160" rx="18" fill="#89b75d" stroke="#315f45" stroke-width="2"/><text x="505.0" y="155" text-anchor="middle" class="zone-title">Игровая / мягкая зона</text><text x="505.0" y="181" text-anchor="middle" class="zone-sub">место для чтения</text><rect x="690" y="125" width="220" height="160" rx="18" fill="#fff" stroke="#315f45" stroke-width="2"/><text x="800.0" y="155" text-anchor="middle" class="zone-title">Стол для занятий</text><text x="800.0" y="181" text-anchor="middle" class="zone-sub">круглый стол</text><rect x="70" y="360" width="360" height="190" rx="18" fill="#fff7df" stroke="#315f45" stroke-width="2"/><text x="250.0" y="390" text-anchor="middle" class="zone-title">Выставка книг</text><text x="250.0" y="416" text-anchor="middle" class="zone-sub">фронтальный показ</text><text x="250.0" y="436" text-anchor="middle" class="zone-sub">обложек</text><rect x="500" y="360" width="410" height="190" rx="18" fill="#eef6ec" stroke="#315f45" stroke-width="2"/><text x="705.0" y="390" text-anchor="middle" class="zone-title">Семейное чтение</text><text x="705.0" y="416" text-anchor="middle" class="zone-sub">мягкая зона</text>
<text x="60" y="690" class="small">Важно: это схематический план для идеи расстановки, а не инженерный строительный проект.</text>
</svg>