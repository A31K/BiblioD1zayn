<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="План помещения для Технологичная медиатека">
<style>
.bg{fill:#eef1f4}.room{fill:#fff;stroke:#6b5c4d;stroke-width:4}.wall{stroke:#6b5c4d;stroke-width:8;stroke-linecap:round}.zone-title{font:700 22px Arial, sans-serif;fill:#6b5c4d}.zone-sub{font:15px Arial, sans-serif;fill:#546457}.caption{font:16px Arial, sans-serif;fill:#536256}.head{font:700 32px Arial, sans-serif;fill:#6b5c4d}.small{font:14px Arial, sans-serif;fill:#617166}
</style>
<rect width="1000" height="720" class="bg"/>
<text x="60" y="60" class="head">План: Технологичная медиатека</text>
<text x="60" y="92" class="caption">Схема расстановки зон, примерно 9 × 7 м. Размеры адаптируются под конкретное помещение.</text>
<rect x="45" y="110" width="910" height="500" rx="26" class="room"/>
<line x1="150" y1="610" x2="330" y2="610" class="wall"/><text x="240" y="646" text-anchor="middle" class="small">вход</text>
<line x1="460" y1="110" x2="630" y2="110" stroke="#9ac29d" stroke-width="8" stroke-linecap="round"/><text x="545" y="100" text-anchor="middle" class="small">окно / свет</text>
<rect x="70" y="125" width="300" height="170" rx="18" fill="#eef2f7" stroke="#315f45" stroke-width="2"/><text x="220.0" y="155" text-anchor="middle" class="zone-title">Компьютерная зона</text><text x="220.0" y="181" text-anchor="middle" class="zone-sub">розетки</text><text x="220.0" y="201" text-anchor="middle" class="zone-sub">кабель-каналы</text><text x="220.0" y="221" text-anchor="middle" class="zone-sub">экраны</text><rect x="420" y="125" width="220" height="170" rx="18" fill="#252b31" stroke="#315f45" stroke-width="2"/><text x="530.0" y="155" text-anchor="middle" class="zone-title">Книжный фонд</text><text x="530.0" y="181" text-anchor="middle" class="zone-sub">открытые стеллажи</text><rect x="690" y="125" width="220" height="170" rx="18" fill="#2c74b8" stroke="#315f45" stroke-width="2"/><text x="800.0" y="155" text-anchor="middle" class="zone-title">Медиазона</text><text x="800.0" y="181" text-anchor="middle" class="zone-sub">экран</text><text x="800.0" y="201" text-anchor="middle" class="zone-sub">просмотр</text><text x="800.0" y="221" text-anchor="middle" class="zone-sub">консультации</text><rect x="70" y="365" width="400" height="180" rx="18" fill="#ffffff" stroke="#315f45" stroke-width="2"/><text x="270.0" y="395" text-anchor="middle" class="zone-title">Рабочие столы</text><text x="270.0" y="421" text-anchor="middle" class="zone-sub">самостоятельная работа</text><rect x="530" y="365" width="380" height="180" rx="18" fill="#f3f4f1" stroke="#315f45" stroke-width="2"/><text x="720.0" y="395" text-anchor="middle" class="zone-title">Лаунж / ожидание</text><text x="720.0" y="421" text-anchor="middle" class="zone-sub">мягкая мебель</text>
<text x="60" y="690" class="small">Важно: это схематический план для идеи расстановки, а не инженерный строительный проект.</text>
</svg>